server:
  port: 8082

spring:
  application:
    name: clientes-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/clientes_db}
    username: ${DB_USER:clientes_user}
    password: ${DB_PASSWORD:clientes_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:http://localhost:8081/auth/jwks}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info