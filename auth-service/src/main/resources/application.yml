server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/auth_db}
    username: ${DB_USER:auth_user}
    password: ${DB_PASSWORD:auth_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

jwt:
  public-key: ${JWT_PUBLIC_KEY:file:../keys/public.pem}     # relativo a la carpeta auth-service
  private-key: ${JWT_PRIVATE_KEY:file:../keys/private.pem}
  expiracion-segundos: 3600

admin:
  password: ${ADMIN_PASSWORD:Admin12345}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info