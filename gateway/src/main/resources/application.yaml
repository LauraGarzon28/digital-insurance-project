server:
  port: 8080            # el monolito (digital-insurance-api) usa 8090, así que ya no chocan

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:        
          routes:       
            - id: auth-route
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**
            - id: clientes-route
              uri: lb://clientes-service
              predicates:
                - Path=/api/clientes/**
            - id: cotizaciones-route
              uri: lb://cotizaciones-service
              predicates:
                - Path=/api/cotizaciones/**
            - id: polizas-route
              uri: lb://polizas-service           
              predicates:
                - Path=/api/polizas/**
            - id: siniestros-route
              uri: lb://siniestros-service
              predicates:
                - Path=/api/siniestros/**
            - id: auditoria-route
              uri: lb://auditoria-service
              predicates:
                - Path=/api/auditoria/**

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka