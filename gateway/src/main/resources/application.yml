server:
  port: 8080

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:http://localhost:8081/auth/jwks}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth
              uri: lb://auth-service
              predicates:
                - Path=/api/auth/**
              filters:
                - RewritePath=/api/(?<segment>.*), /$\{segment}

            - id: clientes
              uri: lb://clientes-service
              predicates:
                - Path=/api/clientes/**
              filters:
                - RewritePath=/api/(?<segment>.*), /$\{segment}

            - id: cotizaciones
              uri: lb://cotizaciones-service
              predicates:
                - Path=/api/cotizaciones/**
              filters:
                - RewritePath=/api/(?<segment>.*), /$\{segment}

            - id: polizas
              uri: ${MONOLITO_URL:http://localhost:8090}
              predicates:
                - Path=/api/polizas/**

            - id: siniestros
              uri: ${MONOLITO_URL:http://localhost:8090}
              predicates:
                - Path=/api/siniestros/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
