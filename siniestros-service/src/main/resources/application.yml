server:
  port: 8084

spring:
  application:
    name: siniestros-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5436/siniestros_db}
    username: ${DB_USER:siniestros_user}
    password: ${DB_PASSWORD:siniestros_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:http://localhost:8081/auth/jwks}
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

eventos:
  exchange: siniestros.exchange
  cola-auditoria: auditoria.siniestros.queue
  routing-key: siniestro.decision

management:
  endpoints:
    web:
      exposure:
        include: health,info
