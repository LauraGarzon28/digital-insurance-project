services:
  polizas-db:
    image: postgres:16
    container_name: polizas-db
    environment:
      POSTGRES_DB: polizas_db
      POSTGRES_USER: polizas_user
      POSTGRES_PASSWORD: polizas_pass
    ports:
      - "5438:5432"   # 5433-5437 ya los usan auth/clientes/cotizaciones/siniestros/auditoria (README del proyecto)
    volumes:
      - polizas_db_data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:latest
    container_name: aseguradora-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

volumes:
  polizas_db_data: