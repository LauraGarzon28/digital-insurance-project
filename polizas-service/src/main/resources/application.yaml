spring:
  application:
    name: polizas-service

  datasource:
    url: jdbc:postgresql://localhost:5433/polizas_db
    username: polizas_user
    password: polizas_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # el esquema lo crea Flyway, no Hibernate
    show-sql: true
    properties:
      hibernate:
        '[format_sql]': true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8082   
              
