spring:
  application:
    name: polizas-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5438/polizas_db}
    username: ${DB_USER:polizas_user}
    password: ${DB_PASSWORD:polizas_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # el esquema lo crea Flyway, no Hibernate
    show-sql: true
    properties:
      hibernate:
        '[format_sql]': true

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:http://localhost:8081/auth/jwks}

# noinspection SpringBootApplicationProperties
polizas:
  mensajeria:
    exchange: ${RABBITMQ_EXCHANGE:seguros.eventos}

cotizaciones:
  base-url: ${COTIZACIONES_URL:http://cotizaciones-service}

server:
  port: ${SERVER_PORT:8086}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info