spring:
  application:
    name: polizas-service

  datasource:
    url: jdbc:postgresql://localhost:5433/polizas_db
    username: polizas_user
    password: polizas_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # el esquema lo crea Flyway, no Hibernate
    show-sql: true
    properties:
      hibernate:
        '[format_sql]': true

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

# noinspection SpringBootApplicationProperties
polizas:
  mensajeria:
    exchange: ${RABBITMQ_EXCHANGE:seguros.eventos}

server:
  port: 8086