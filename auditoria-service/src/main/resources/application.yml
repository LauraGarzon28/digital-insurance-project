server:
  port: 8085

spring:
  application:
    name: auditoria-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5437/auditoria_db}
    username: ${DB_USER:auditoria_user}
    password: ${DB_PASSWORD:auditoria_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

eventos:
  exchange: siniestros.exchange
  cola-auditoria: auditoria.siniestros.queue
  routing-key: siniestro.decision

management:
  endpoints:
    web:
      exposure:
        include: health,info
